# 项目相关配置
agileboot:
  # 名称
  name: agileboot-admin
  # 版本
  version: 1.8.0
  # 版权年份
  copyright-year: 2022
  # 实例演示开关
  demo-enabled: true
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数组计算 char 字符验证
  captchaType: math
  # 对应的公钥放在前端项目中的utils/rsaUtils类中
  rsaPrivateKey: 
  # 是否检查 i18n 资源文件（messages.properties）是否都有对应的键值对
  checkI18nKey: false
  # 追踪请求ID的key
  traceRequestIdKey: AG-RequestId


# Spring配置
spring:
  application:
    name: ${agileboot.name}
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
    # 有些版本的 IDEA  会自动设置properties的编码为IOS-8859-1 请在IDEA配置里设置成UTF8
    encoding: UTF-8

  # 文件上传
  servlet:
     multipart:
       # 单个文件大小
       max-file-size:  10MB
       # 设置总上传的文件大小
       max-request-size:  20MB

  # 服务模块
  devtools:
    restart:
      # 热部署开关  线上记得关闭
      enabled: false

  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER

  jackson:
    deserialization:
      fail-on-unknown-properties: false
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd HH:mm:ss


# MyBatis配置
mybatis-plus:
    # 搜索指定包别名 使用简短的类型名称来代替完整的类型名称
#    typeAliasesPackage: com.agileboot.orm.*
    # 配置mapper的扫描，找到所有的mapper.xml映射文件
    mapperLocations: classpath*:mapper/**/*Mapper.xml
    # 加载全局的配置文件
    configuration:
      cacheEnabled: true
      useGeneratedKeys: true
      defaultExecutorType: SIMPLE
      logImpl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    global-config:
      refresh: true


# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql


#  springdoc
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
    groups:
      enabled: true
  # 配置需要生成接口文档的扫描包
  packages-to-scan: com.agileboot
  group-configs:
    - group: '公共API'
      packages-to-scan: com.agileboot.admin.modular.common
    - group: '内置系统API'
      packages-to-scan: com.agileboot.admin.modular.sys.controller.system





